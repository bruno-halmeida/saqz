# Testes do app toda madrugada, só na main: os de unidade e tela (detekt, JVM, simulador iOS, Swift e
# Node, para pegar quebra antes da RC) e os CAROS, que não rodam na RC: instrumentados do Android
# (androidTest) e E2E instalado (tests/e2e/android, com backend, Postgres e Firebase Auth Emulator
# descartáveis) em emulador no Ubuntu, e os testes do web app (wasmJsNodeTest e scripts Node).
# Pula a noite se a main não mudou desde a última execução que passou.
# Se falhar, abre (ou comenta em) a issue "Testes noturnos do app falharam"; quando volta a
# passar, comenta e fecha. Não trava RC nem release. Execução à mão: Actions → Mobile · testes
# noturnos → Run workflow (ou `gh workflow run mobile-nightly.yml`), que não pula.
name: Mobile · testes noturnos

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-nightly
  cancel-in-progress: false

jobs:
  checar:
    name: A main mudou?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      executar: ${{ steps.decidir.outputs.executar }}
    steps:
      - name: Comparar com a última execução que passou
        id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ultimo=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mobile-nightly.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          # O agendamento só vale para a main (o cron roda no branch padrão); o disparo à mão roda em qualquer branch.
          if [[ "$EVENTO" == "schedule" && "$ultimo" == "$GITHUB_SHA" ]]; then
            echo "executar=false" >> "$GITHUB_OUTPUT"
            echo "A main (\`${GITHUB_SHA:0:9}\`) não mudou desde a última noite que passou; nada a testar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "executar=true" >> "$GITHUB_OUTPUT"
          fi

  verificar:
    name: detekt e testes na JVM
    needs: checar
    if: needs.checar.outputs.executar == 'true'
    uses: ./.github/workflows/mobile-verify.yml

  testes-ios:
    name: Simulador iOS, Swift e Node
    needs: checar
    if: needs.checar.outputs.executar == 'true'
    uses: ./.github/workflows/mobile-tests.yml
    with:
      keep_going: true

  instrumentados:
    name: Instrumentados do Android (emulador)
    needs: checar
    if: needs.checar.outputs.executar == 'true'
    runs-on: ubuntu-latest
    outputs:
      falhas: ${{ steps.falhas.outputs.lista }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v6
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: connectedDevDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # Sem perfil o AVD nasce com a tela de 320x480, onde a lista do Perfil não compõe "Sair" e os E2E estouram.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: mobile
          script: ./gradlew :android-app:connectedDevDebugAndroidTest
      - name: Listar os testes que falharam
        id: falhas
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          python3 mobile/ci/failed_tests.py mobile | awk 'NF' | sort -u | head -100 > falhas.txt
          { echo "### Testes que falharam"; echo; sed 's/^/- /' falhas.txt; } >> "$GITHUB_STEP_SUMMARY"
          { echo "lista<<FALHAS_EOF"; cat falhas.txt; echo "FALHAS_EOF"; } >> "$GITHUB_OUTPUT"
      - name: Guardar os relatórios
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-instrumentados
          retention-days: 14
          if-no-files-found: ignore
          path: |
            mobile/android-app/build/reports/androidTests/
            mobile/android-app/build/outputs/androidTest-results/

  e2e-android:
    name: E2E instalado do Android (emulador e stack descartável)
    needs: checar
    if: needs.checar.outputs.executar == 'true'
    runs-on: ubuntu-latest
    outputs:
      falhas: ${{ steps.falhas.outputs.lista }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v6
      - name: Firebase CLI na versão que o runner exige
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/e2e-tools"
          mkdir -p "$tools"
          npm install --prefix "$tools" firebase-tools@15.25.1
          echo "SAQZ_E2E_FIREBASE_BIN=$tools/node_modules/firebase-tools/lib/bin/firebase.js" >> "$GITHUB_ENV"
      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Jornadas E2E (tests/e2e/android/run.mjs)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # Sem perfil o AVD nasce com a tela de 320x480, onde a lista do Perfil não compõe "Sair" e os E2E estouram.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          # O AVD do runner não tem teclado físico: o Gboard sobe a cada campo e cobre a lista, e os testes que
          # rolam ou conferem "visível" estouram. Sem método de entrada, o teclado não abre (o texto entra pela semântica).
          script: |
            adb -s emulator-5554 shell 'for ime in $(ime list -s | tr -d "\r"); do ime disable "$ime"; done'
            node tests/e2e/android/run.mjs --serial emulator-5554
      - name: Listar os testes que falharam
        id: falhas
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          python3 mobile/ci/failed_tests.py mobile | awk 'NF' | sort -u | head -100 > falhas.txt
          { echo "### Testes que falharam"; echo; sed 's/^/- /' falhas.txt; } >> "$GITHUB_STEP_SUMMARY"
          { echo "lista<<FALHAS_EOF"; cat falhas.txt; echo "FALHAS_EOF"; } >> "$GITHUB_OUTPUT"
      - name: Guardar os relatórios
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-e2e-android
          retention-days: 14
          if-no-files-found: ignore
          path: |
            mobile/android-app/build/reports/androidTests/
            mobile/android-app/build/outputs/androidTest-results/
            ${{ runner.temp }}/saqz-e2e-*/

  web-app:
    name: Web app (Kotlin/Wasm no Node)
    needs: checar
    if: needs.checar.outputs.executar == 'true'
    runs-on: ubuntu-latest
    outputs:
      falhas: ${{ steps.falhas.outputs.lista }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Gradle com cache
        uses: gradle/actions/setup-gradle@v6
      - name: wasmJsNodeTest e scripts do loader e do service worker
        working-directory: mobile
        run: ./gradlew :web-app:wasmJsNodeTest :web-app:hostScriptsTest --continue
      - name: Listar os testes que falharam
        id: falhas
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          python3 mobile/ci/failed_tests.py mobile | awk 'NF' | sort -u | head -100 > falhas.txt
          { echo "### Testes que falharam"; echo; sed 's/^/- /' falhas.txt; } >> "$GITHUB_STEP_SUMMARY"
          { echo "lista<<FALHAS_EOF"; cat falhas.txt; echo "FALHAS_EOF"; } >> "$GITHUB_OUTPUT"
      - name: Guardar os relatórios
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-web-app
          retention-days: 14
          if-no-files-found: ignore
          path: mobile/web-app/build/reports/

  relatar:
    name: Issue de acompanhamento
    needs: [checar, verificar, testes-ios, instrumentados, e2e-android, web-app]
    # Só a main abre ou fecha a issue; execuções à mão em outros branches (validação) não mexem nela.
    if: ${{ !cancelled() && needs.checar.outputs.executar == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITULO: Testes noturnos do app falharam
      FALHAS_IOS: ${{ needs.testes-ios.outputs.falhas }}
      FALHAS_INSTRUMENTADOS: ${{ needs.instrumentados.outputs.falhas }}
      FALHAS_E2E: ${{ needs.e2e-android.outputs.falhas }}
      FALHAS_WEB: ${{ needs.web-app.outputs.falhas }}
      EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      R_VERIFICAR: ${{ needs.verificar.result }}
      R_IOS: ${{ needs.testes-ios.result }}
      R_INSTRUMENTADOS: ${{ needs.instrumentados.result }}
      R_E2E: ${{ needs.e2e-android.result }}
      R_WEB: ${{ needs.web-app.result }}
    steps:
      - name: Abrir, comentar ou fechar a issue
        run: |
          set -euo pipefail
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITULO\")][0].number // \"\"")
          falhou=""
          for par in "detekt e testes na JVM=$R_VERIFICAR" "Simulador iOS, Swift e Node=$R_IOS" \
                     "Instrumentados do Android=$R_INSTRUMENTADOS" "E2E instalado do Android=$R_E2E" "Web app=$R_WEB"; do
            [[ "${par##*=}" == "success" ]] || falhou+="- ${par%=*}: ${par##*=}"$'\n'
          done
          if [[ -z "$falhou" ]]; then
            [[ -n "$numero" ]] || { echo "Passou e não há issue aberta."; exit 0; }
            gh issue close "$numero" --repo "$GITHUB_REPOSITORY" \
              --comment "Os testes noturnos voltaram a passar no commit \`${GITHUB_SHA:0:9}\`: $EXECUCAO"
            exit 0
          fi
          cerca='```'
          testes=$(printf '%s\n%s\n%s\n%s' "$FALHAS_IOS" "$FALHAS_INSTRUMENTADOS" "$FALHAS_E2E" "$FALHAS_WEB" | awk 'NF')
          corpo=$(printf 'Execução: %s\nCommit: %s\n\nEtapas que não passaram:\n\n%s\nTestes que falharam (iOS, Swift, Node, instrumentados, E2E e web app):\n\n%s\n%s\n%s\n\nOs relatórios ficam como artefatos da execução (relatorios-*).' \
            "$EXECUCAO" "${GITHUB_SHA:0:9}" "$falhou" "$cerca" "${testes:-(nenhum listado)}" "$cerca")
          if [[ -n "$numero" ]]; then
            gh issue comment "$numero" --repo "$GITHUB_REPOSITORY" --body "$corpo"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "$corpo"
          fi
