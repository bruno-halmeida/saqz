name: Publicar release do backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar alterações e calcular a próxima versão
        id: changes
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def version(tag):
              return tuple(map(int, tag[2:].split(".")))

          subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"], check=True)
          previous = [tag for tag in git("tag").splitlines()
                      if re.fullmatch(r"v\.\d+\.\d+\.\d+", tag)]
          latest = max(previous, key=version) if previous else None
          if latest:
              if subprocess.run(["git", "merge-base", "--is-ancestor", latest, "HEAD"]).returncode:
                  subprocess.run(["git", "merge-base", "--is-ancestor", "HEAD", latest], check=True)
                  print("Commit anterior à última release; publicação ignorada.")
                  raise SystemExit(0)
              major, minor, patch = version(latest)
              tag = f"v.{major}.{minor}.{patch + 1}"
          else:
              tag = "v.0.0.1"
          baseline = latest or git("hash-object", "-w", "-t", "tree", "/dev/null")
          result = subprocess.run(["git", "diff", "--quiet", baseline, "HEAD", "--", "backend/"])
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)
          changed = result.returncode == 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"backend={str(changed).lower()}\n")
              output.write(f"tag={tag}\n")
          print(f"Backend alterado; publicar {tag}." if changed else "Backend sem alterações; publicação ignorada.")
          PY

      - name: Preparar Buildx
        if: steps.changes.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Autenticar no GHCR
        if: steps.changes.outputs.backend == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Impedir sobrescrita de uma imagem publicada
        if: steps.changes.outputs.backend == 'true'
        env:
          RELEASE_IMAGE: ghcr.io/bruno-halmeida/saqz-backend:${{ steps.changes.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$RELEASE_IMAGE" >/dev/null 2>&1; then
            echo 'A imagem já existe sem a tag Git correspondente. Recupere a tag no commit original antes de continuar.' >&2
            exit 1
          fi
      - name: Construir e publicar
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bruno-halmeida/saqz-backend:${{ steps.changes.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/bruno-halmeida/saqz
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.changes.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Registrar a versão publicada no Git
        if: steps.changes.outputs.backend == 'true'
        env:
          RELEASE_TAG: ${{ steps.changes.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Saqz backend $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
