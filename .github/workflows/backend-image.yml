name: Publicar release do backend

on:
  push:
    tags: ['v.*']

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validar versão e commit na main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Use uma tag no formato v.0.0.1.' >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main
      - name: Verificar alterações no backend desde a release anterior
        id: changes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def version(tag):
              return tuple(map(int, tag[2:].split(".")))

          current = os.environ["RELEASE_TAG"]
          previous = [tag for tag in git("tag", "--merged", "HEAD").splitlines()
                      if re.fullmatch(r"v\.\d+\.\d+\.\d+", tag) and version(tag) < version(current)]
          baseline = max(previous, key=version) if previous else git("hash-object", "-w", "-t", "tree", "/dev/null")
          result = subprocess.run(["git", "diff", "--quiet", baseline, "HEAD", "--", "backend/"])
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)
          changed = result.returncode == 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"backend={str(changed).lower()}\n")
          print("Backend alterado; publicar imagem." if changed else "Backend sem alterações; publicação ignorada.")
          PY

  publish:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4
      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bruno-halmeida/saqz-backend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/bruno-halmeida/saqz
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
