name: Initialization Gate

# CI de PR ágil (VUL-23): apenas gates rápidos e path-filtered bloqueiam PR.
# Emulador Android e iOS saem do caminho de PR — vivem em full-ui-gate.yml
# (nightly + workflow_dispatch), obrigatórios antes do merge de tickets de
# alto risco (C1/D/F). scripts/check-all local continua rodando tudo.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed workspaces
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scripts:
              - 'scripts/**'
              - 'tests/**'
              - '.github/**'
            backend:
              - 'backend/**'
              - 'bruno/**'
              - 'firebase/**'
              - 'scripts/**'
              - '.github/**'
            mobile:
              - 'mobile/**'
              - 'scripts/**'
              - '.github/**'
            landing:
              - 'landing-page/**'
              - 'scripts/**'
              - '.github/**'

  scripts-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run script test suite
        run: scripts/test-scripts

  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify disposable test tooling
        run: |
          docker info
          npx --yes firebase-tools@15.23.0 --version
      - name: Run backend gate
        run: scripts/check-gradle --backend

  mobile-fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run mobile JVM gate
        run: scripts/check-gradle --mobile-jvm

  landing-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.landing == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run landing gate
        run: scripts/check-landing

  initialization-gate:
    runs-on: ubuntu-latest
    needs: [scripts-gate, backend-gate, mobile-fast-gate, landing-gate]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Evaluate gate results
        run: scripts/evaluate-ci-gates "$SCRIPTS_RESULT" "$BACKEND_RESULT" "$MOBILE_RESULT" "$LANDING_RESULT"
        env:
          SCRIPTS_RESULT: ${{ needs.scripts-gate.result }}
          BACKEND_RESULT: ${{ needs.backend-gate.result }}
          MOBILE_RESULT: ${{ needs.mobile-fast-gate.result }}
          LANDING_RESULT: ${{ needs.landing-gate.result }}
