name: API 35 Probe

# Sonda de comportamento moderno do Android fora do caminho crítico das PRs:
# o emulador API 35 é flaky e caro (até 45min). Roda de madrugada e sob demanda.
on:
  schedule:
    - cron: '0 6 * * *' # ~03:00 BRT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-api35-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM for Android emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Probe Android API 35 modern UI behavior
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          avd-name: saqz-api35-probe
          emulator-build: 13823996
          emulator-boot-timeout: 300
          pre-emulator-launch-script: adb start-server
          disable-animations: true
          script: mobile/gradlew -p mobile :android-app:connectedDevDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=br.com.saqz.androidapp.ModernAndroidBehaviorTest --console=plain
