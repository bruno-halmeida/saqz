# Publicação do app, só à mão, rodando sempre da main ("Use workflow from" = main). A RC é
# escolhida pela tag rc-app-vX.Y.Z (entrada `tag`): o job lê versão e build dela, então correções
# deste workflow valem para RCs já criadas. Não rebuilda: promove no Play o build que está na
# trilha interna para produção (100%) com as notas PÚBLICAS e, na App Store, anexa o build já
# processado à versão, grava as novidades e submete à revisão com liberação automática. A lógica
# das lojas está em mobile/ci/publish_stores.py. Com `simular` valida tudo e não publica nada.
name: Mobile · publicar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da RC a publicar (rc-app-vX.Y.Z)"
        required: true
        type: string
      lojas:
        description: "Em quais lojas publicar"
        required: true
        type: choice
        options: [ambas, android, ios]
        default: ambas
      notas_publicas:
        description: "Novidades públicas, pt-BR, até 500 caracteres (não são as notas de teste da RC)"
        required: true
        type: string
      simular:
        description: "Simulação: valida tudo, mas não faz commit no Play nem envia à Apple"
        type: boolean
        default: false
      full_tests:
        description: "Rodar a esteira completa de testes antes (simulador iOS, Swift e Node; demora)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Conferir a tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - name: Obter o código e as tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ler versão e build da tag
        id: read
        env:
          TAG: ${{ inputs.tag }}
          NOTAS: ${{ inputs.notas_publicas }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^rc-app-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "A tag deve ser rc-app-vX.Y.Z (recebi '$TAG')." >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "A tag $TAG não existe." >&2; exit 1; }
          trimmed=$(printf '%s' "$NOTAS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [[ -n "$trimmed" ]] || { echo "Informe as notas públicas." >&2; exit 1; }
          (( ${#trimmed} <= 500 )) || { echo "Notas públicas com ${#trimmed} caracteres; o Play aceita até 500." >&2; exit 1; }
          sha=$(git rev-list -n1 "$TAG")
          git checkout -q --detach "$sha"
          current=$(mobile/ci/version.sh show)
          [[ "$current" == "version=$version build="* ]] || { echo "O código na tag diz '$current', não a versão $version." >&2; exit 1; }
          build=${current##*build=}
          {
            echo "version=$version"
            echo "build=$build"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Publicar **$version** (build **$build**) a partir de \`$TAG\` — lojas: **${{ inputs.lojas }}**${{ inputs.simular && ' (simulação)' || '' }}" >> "$GITHUB_STEP_SUMMARY"

  full-tests:
    name: Esteira completa de testes
    needs: prepare
    if: inputs.full_tests
    uses: ./.github/workflows/mobile-tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  stores:
    name: ${{ inputs.simular && 'Lojas (simulação)' || 'Lojas → produção' }}
    needs: [prepare, full-tests]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.full-tests.result == 'success' || needs.full-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile
    steps:
      - name: Obter o script (main)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependências
        run: pip install -r mobile/ci/requirements.txt
      - name: Testes do script
        working-directory: mobile/ci
        run: python -m unittest test_publish_stores
      - name: Publicar nas lojas
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          LOJAS: ${{ inputs.lojas }}
          NOTAS: ${{ inputs.notas_publicas }}
          SIMULAR: ${{ inputs.simular }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --build "$BUILD" --lojas "$LOJAS" --notas "$NOTAS")
          [[ "$SIMULAR" == "true" ]] && args+=(--simular)
          python mobile/ci/publish_stores.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag app-vX.Y.Z
    needs: [prepare, stores]
    # Sem o !cancelled(), o job some quando a esteira completa é pulada (full_tests desligado): o GitHub pula quem
    # depende, mesmo indiretamente, de um job pulado. Foi o que deixou a 1.0.6 sem tag em 15/10/2026.
    if: ${{ !cancelled() && !inputs.simular && needs.stores.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o commit da RC
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Criar e enviar a tag (se ainda não existir)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          NOTAS: ${{ inputs.notas_publicas }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/app-v$VERSION" >/dev/null 2>&1; then
            echo "A tag app-v$VERSION já existe (publicação anterior em outra loja)."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "app-v$VERSION" -m "App $VERSION (build $BUILD)" -m "$NOTAS"
          git push origin "refs/tags/app-v$VERSION"
          echo "Publicado **$VERSION** (build **$BUILD**): tag \`app-v$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
