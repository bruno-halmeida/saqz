name: Full UI Gate

# Testes de UI completos fora do caminho de PR (VUL-23): emulador Android
# (connectedDevDebugAndroidTest, API 30) e suíte iOS (macOS). Roda no nightly e
# sob demanda via workflow_dispatch. Regra do projeto: dispatch obrigatório e
# verde ANTES do merge dos tickets de alto risco (C1/VUL-29, D/VUL-36, F/VUL-40)
# e de qualquer PR que toque o entry point ou o login.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM for Android emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Start Android emulator and run instrumented gate
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_atd
          arch: x86
          profile: pixel_2
          ram-size: 2048M
          avd-name: saqz-ci
          emulator-build: 13823996
          emulator-boot-timeout: 300
          pre-emulator-launch-script: adb start-server
          disable-animations: true
          script: scripts/check-gradle --instrumented

  ios-gate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Cache SPM / DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-spm-${{ hashFiles('mobile/ios-app/SaqzIOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run iOS gate
        run: scripts/check-ios --dev-only

  report-failure:
    # Falha do gate completo não pode ser silenciosa (VUL-23): abre/atualiza uma
    # issue para o run vermelho em vez de esperar alguém olhar a aba Actions.
    runs-on: ubuntu-latest
    needs: [android-ui-gate, ios-gate]
    if: failure()
    steps:
      - name: Report red full UI gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="full-ui-gate vermelho em $(date -u +%Y-%m-%d)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "full-ui-gate vermelho in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Novo run vermelho: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "O gate completo de UI (emulador Android + iOS) falhou fora do caminho de PR. Run: $RUN_URL — triagem necessária antes do próximo merge de risco (C1/D/F)."
          fi
