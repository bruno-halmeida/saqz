server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A lógica de para onde cada aparelho vai mora no index.html: o navegador confere a cada visita
    # em vez de reaproveitar uma versão antiga pelo Last-Modified. Os arquivos de associação têm no-store.
    add_header Cache-Control "no-cache";

    # A Apple e o Google leem estes arquivos direto na origem, sem redirect.
    # O AASA nao tem extensao, entao sem `default_type` o nginx responderia
    # application/octet-stream e a associacao falharia.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
