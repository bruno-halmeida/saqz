# Web app do Saqz em https://saqz.app/app/ (container próprio, roteado pelo Traefik por PathPrefix).
# O app chama a API pelo mesmo origin (/app/api/...), e este nginx repassa para api.saqz.app:
# sem CORS e sem preflight a cada chamada, o que pesa no 4G.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript application/json text/css image/svg+xml font/ttf;

    # Sem bloco `types` aqui: ele substitui a tabela inteira (HTML e JS viravam octet-stream).
    # O mime.types do nginx:alpine já mapeia .wasm para application/wasm.

    location = /app { return 301 /app/; }

    # Login com Google: o authDomain do web app é o próprio saqz.app, e /__/auth/ (handler do OAuth)
    # e /__/firebase/ (config) são repassados de forma transparente para o Firebase. Assim o retorno
    # do Google é first-party e funciona no Safari e no Chrome, que isolam o storage de terceiros.
    # https://firebase.google.com/docs/auth/web/redirect-best-practices (opção 3)
    location /__/ {
        proxy_pass https://saquz-app.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host saquz-app.firebaseapp.com;
        proxy_http_version 1.1;
    }

    # A landing e a página de links só mandam gente para cá se isto responder: publicar a landing
    # antes do web app (ou tirá-lo do ar) não quebra o botão. CORS aberto porque links.saqz.app pergunta.
    location = /app/disponivel.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true}';
    }

    location /app/api/ {
        # A barra no fim tira o prefixo: /app/api/api/session -> /api/session.
        proxy_pass https://api.saqz.app/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.saqz.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # O webpack põe hash no nome dos .wasm: podem ficar em cache para sempre.
    location ~ ^/app/[0-9a-f]+\.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sem hash no nome: o navegador revalida a cada visita (ETag) para nunca misturar versões.
    location ~ ^/app/(saqz-web\.js|saqz-config\.js|saqz-bridge\.js|saqz-loader\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service worker (cache das próximas aberturas): sempre revalidado, senão a troca de versão atrasa.
    # O escopo /app/ já é o da pasta do arquivo; o cabeçalho só deixa isso explícito.
    location = /app/saqz-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/app/";
        try_files $uri =404;
    }

    # A Inter vai em .ttf (~400 KB cada, 4 pesos): com o tipo certo o gzip corta quase metade.
    location ~ ^/app/.+\.ttf$ {
        types { }
        default_type font/ttf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Tela de início (iPhone "Adicionar à Tela de Início" e Android): manifesto com o tipo certo e
    # sem cair no index.html; os ícones são arquivos comuns servidos pelo bloco abaixo.
    location = /app/manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /app/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ /app/index.html;
    }
}
