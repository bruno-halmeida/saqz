# Web app do Saqz no saqz-server, fora do clone /root/applications/saqz: o deploy é por rsync
# do build (deploy-web.sh), não por git pull. O Traefik do servidor manda saqz.app/app/ para cá;
# o resto de saqz.app continua no container da landing.
services:
  web-app:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - local-server-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saqz-web-app.rule=Host(`saqz.app`) && (Path(`/app`) || PathPrefix(`/app/`))"
      - "traefik.http.routers.saqz-web-app.priority=100"
      - "traefik.http.routers.saqz-web-app.entrypoints=websecure"
      - "traefik.http.routers.saqz-web-app.tls=true"
      - "traefik.http.services.saqz-web-app.loadbalancer.server.port=80"

networks:
  local-server-network:
    external: true
