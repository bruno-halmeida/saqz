<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Saqz">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="robots" content="noindex">
  <title>Saqz</title>
  <style>
    /* O app é desenhado para celular. No desktop ele fica numa coluna de celular centralizada
       em vez de esticar campos e botões até a borda da tela. */
    html { height: 100%; background: #f5f5f7; }
    /* Altura visível de verdade: no Safari do iPhone `bottom: 0` de um elemento fixo vale até a borda da
       janela grande, atrás da barra de endereços e da barra inferior, e escondia o fim da tela de entrada
       (botão "Criar conta" e aceite dos Termos). 100dvh acompanha a barra; 100vh é só o plano B.
       Sem viewport-fit=cover o Safari já mantém o conteúdo fora do entalhe e do indicador inicial. */
    body { position: fixed; top: 0; left: 0; right: 0; margin: 0 auto; padding: 0;
      height: 100%; height: 100vh; height: 100dvh; height: var(--saqz-vh, 100dvh);
      width: 100%; max-width: 480px; overflow: hidden; background: #f5f5f7;
      overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    @media (min-width: 520px) {
      html { background: #e7e8ec; }
      body { box-shadow: 0 0 0 1px rgba(7, 16, 37, .06), 0 24px 64px rgba(7, 16, 37, .14); }
    }
    canvas { outline: none; }
    /* Tela leve: aparece no primeiro quadro, antes do .wasm. O saqz-loader.js preenche progresso e convite. */
    #saqz-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; color: #3c4257; }
    #saqz-loading .sq-box { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 280px; }
    #saqz-loading .sq-logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 6px 20px rgba(6, 56, 223, .22); }
    #saqz-loading .sq-brand { margin-top: 14px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; color: #0e1738; }
    #saqz-loading .sq-context { margin: 10px 0 0; font-size: 15px; line-height: 1.35; color: #3c4257; overflow-wrap: anywhere; }
    #saqz-loading .sq-bar { position: relative; width: 100%; height: 4px; margin-top: 24px; border-radius: 2px;
      background: #d8dde8; overflow: hidden; }
    #saqz-loading .sq-bar > i { position: absolute; inset: 0; border-radius: 2px; background: #0638df;
      transform: scaleX(0); transform-origin: left center; transition: transform .25s ease-out; }
    #saqz-loading .sq-bar.sq-indeterminate > i { width: 40%; transform: none; transition: none;
      animation: sq-slide 1.2s ease-in-out infinite; }
    #saqz-loading .sq-reload { margin-top: 20px; font-size: 14px; color: #3c4257; }
    #saqz-loading .sq-reload[hidden] { display: none; }
    #saqz-loading .sq-reload p { margin: 0 0 10px; }
    #saqz-loading .sq-reload button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 22px;
      background: #0638df; color: #fff; font: 600 15px Inter, system-ui, -apple-system, sans-serif; }
    @keyframes sq-slide { from { left: -40%; } to { left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #saqz-loading .sq-bar.sq-indeterminate > i { animation: none; width: 100%; opacity: .35; }
    }
  </style>
  <!-- A Inter vem dos compose resources e só seria pedida depois do .wasm subir: o preload
       baixa as quatro em paralelo e os textos não aparecem em branco no primeiro quadro. -->
  <link rel="preload" href="composeResources/br.com.saqz.designsystem.resources/font/inter_regular.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="composeResources/br.com.saqz.designsystem.resources/font/inter_semibold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="composeResources/br.com.saqz.designsystem.resources/font/inter_bold.ttf" as="fetch" type="font/ttf" crossorigin>
  <link rel="preload" href="composeResources/br.com.saqz.designsystem.resources/font/inter_light.ttf" as="fetch" type="font/ttf" crossorigin>
  <script src="saqz-config.js"></script>
  <script>
    // Altura que a pessoa enxerga de fato. No Safari do iPhone 100dvh ainda conta a faixa atrás da barra
    // inferior flutuante e o fim da tela (aceite dos Termos, "Criar conta") fica coberto: visualViewport
    // desconta as barras e avisa quando elas encolhem ou voltam. Sem a API, o CSS cai em 100dvh.
    (function () {
      var viewport = window.visualViewport;
      if (!viewport) return;
      function sync() {
        var height = Math.round(viewport.height);
        if (height > 0) document.documentElement.style.setProperty("--saqz-vh", height + "px");
      }
      sync();
      viewport.addEventListener("resize", sync);
      window.addEventListener("orientationchange", sync);
    })();
  </script>
  <script>
    // O bridge do Firebase carrega como módulo ES (assíncrono); o Kotlin espera esta promessa.
    window.saqzBridgeReady = new Promise(function (resolve) { window.__saqzResolveBridge = resolve; });
  </script>
  <script type="module" src="saqz-bridge.js"></script>
</head>
<body>
  <div id="saqz-loading" role="status" aria-live="polite">
    <div class="sq-box">
      <img class="sq-logo" src="icon-192.png" width="72" height="72" alt="">
      <div class="sq-brand">Saqz</div>
      <p class="sq-context" hidden></p>
      <div class="sq-bar" role="progressbar" aria-label="Carregando o Saqz" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      <!-- Aparece depois de ~20 s (saqz-loader.js): primeira carga lenta ou travada. -->
      <div class="sq-reload" hidden>
        <p>Está demorando mais que o normal.</p>
        <button type="button">Recarregar</button>
      </div>
    </div>
  </div>
  <!-- Antes do script que baixa o app: instala a contagem de bytes do .wasm e busca o convite. -->
  <script src="saqz-loader.js"></script>
  <script>
    // Kotlin/Wasm precisa de WasmGC (iOS 18.2+, Chrome 119+, Firefox 120+). Sem ele o .wasm nem compila:
    // em vez de tela branca, a pessoa vê o que fazer. O módulo validado é o menor possível com um tipo struct.
    (function () {
      var gc = false;
      try { gc = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 127, 0])); } catch (e) { gc = false; }
      if (gc) {
        var script = document.createElement("script");
        script.src = "saqz-web.js";
        document.body.appendChild(script);
        // Cache das próximas aberturas (.wasm, scripts versionados, fontes). Só em produção: no dev
        // server o cache atrapalharia o recarregamento.
        var config = window.SAQZ_WEB_CONFIG || {};
        if (config.environment === "prod" && "serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("saqz-sw.js", { scope: "./" }).catch(function () {});
          });
        }
        return;
      }
      document.getElementById("saqz-loading").textContent =
        "Este navegador ainda não abre o Saqz. No iPhone, atualize o iOS (18.2 ou mais novo); no Android, baixe o app no Google Play.";
    })();
  </script>
</body>
</html>
