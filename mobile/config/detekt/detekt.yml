complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 20
    ignoreAnnotated:
      - 'Composable'
  LargeClass:
    # 400: uma ViewModel MVI decomposta em funções privadas pequenas cabe aqui;
    # 150 era violado por 8 classes core no dia em que a regra passou a rodar.
    threshold: 400
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    ignoreAnnotatedFunctions:
      - 'Composable'
    # Muitas funções privadas pequenas é o estilo que LongMethod incentiva;
    # o limite vale para a superfície pública da classe/arquivo.
    ignorePrivate: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    ignoreAnnotated:
      - 'Composable'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  ObjectPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  PackageNaming:
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  MatchingDeclarationName:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: false
  HasPlatformType:
    active: true

style:
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    max: 4
    excludedFunctions:
      - "equals"
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  UseDataClass:
    active: false
  LoopWithTooManyJumpStatements:
    maxJumpCount: 2
  ThrowsCount:
    max: 3
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 5
  UnusedPrivateMember:
    ignoreAnnotated:
      - 'Preview'
      - 'Composable'
Compose:
  CompositionLocalAllowlist:
    # Locals do próprio design system: é o mecanismo canônico de tema (SaqzTheme).
    allowedCompositionLocals:
      - LocalSaqzColors
      - LocalSaqzMetrics
      - LocalSaqzTypography
      - LocalSaqzMotion
      - LocalSaqzShadows
      - LocalSaqzChrome
