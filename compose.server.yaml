# Overlay for the home server. Usage:
#   docker compose -f compose.yaml -f compose.server.yaml up -d --build
# Publishes:
#   backend      -> https://saqz-api.brunoalmeida.dev
#   adm-web      -> https://saqzweb.brunoalmeida.dev
#   landing-page -> https://saqz.app
#   mailpit      -> https://saqz-mail.brunoalmeida.dev (exige SAQZ_MAILPIT_AUTH no .env)
# Database: Supabase (dev) via IPv4 session pooler; local postgres disabled.
services:
  backend:
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      SPRING_DATASOURCE_USERNAME: postgres.jrwpmobttggeturyekot
      SPRING_DATASOURCE_PASSWORD: ${SAQZ_DB_PASSWORD}
      SAQZ_ADMINWEB_ORIGINS: https://saqzweb.brunoalmeida.dev
      SAQZ_ASAAS_API_KEY: ${SAQZ_ASAAS_API_KEY}
      SAQZ_ASAAS_WEBHOOK_TOKEN: ${SAQZ_ASAAS_WEBHOOK_TOKEN}
      # Producao: trocar no .env para https://api.asaas.com/v3 junto com a chave
      # de producao. O default aqui evita mandar string vazia (que sobrescreveria
      # o default de application.properties e quebraria a base-url).
      SAQZ_ASAAS_BASE_URL: ${SAQZ_ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
    depends_on: !reset {}
    networks:
      - default
      - local-server-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saqz-api.rule=Host(`saqz-api.brunoalmeida.dev`)"
      - "traefik.http.routers.saqz-api.entrypoints=websecure"
      - "traefik.http.routers.saqz-api.tls=true"
      - "traefik.http.services.saqz-api.loadbalancer.server.port=8080"

  adm-web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./adm-web:/usr/share/nginx/html:ro
      - ./firebase-config.server.js:/usr/share/nginx/html/assets/firebase-config.js:ro
      - ./nginx-adm-web.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - local-server-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saqz-web.rule=Host(`saqzweb.brunoalmeida.dev`)"
      - "traefik.http.routers.saqz-web.entrypoints=websecure"
      - "traefik.http.routers.saqz-web.tls=true"
      - "traefik.http.services.saqz-web.loadbalancer.server.port=80"

  landing-page:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./landing-page:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - local-server-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saqz-landing.rule=Host(`saqz.app`) || Host(`www.saqz.app`)"
      - "traefik.http.routers.saqz-landing.entrypoints=websecure"
      - "traefik.http.routers.saqz-landing.tls=true"
      - "traefik.http.services.saqz-landing.loadbalancer.server.port=80"
      # www -> apex, so search engines see a single canonical host
      - "traefik.http.middlewares.saqz-landing-www.redirectregex.regex=^https?://www\\.saqz\\.app/(.*)"
      - "traefik.http.middlewares.saqz-landing-www.redirectregex.replacement=https://saqz.app/$${1}"
      - "traefik.http.middlewares.saqz-landing-www.redirectregex.permanent=true"
      - "traefik.http.routers.saqz-landing.middlewares=saqz-landing-www"

  # A caixa de teste do ambiente: e aqui que o QA le o codigo de quatro digitos do reset
  # de senha. O Mailpit ja subia neste overlay (o backend entrega nele desde sempre), mas
  # sem router ficava alcancavel so de dentro da rede do servidor.
  #
  # `MP_UI_AUTH` e obrigatorio, e o `:?` derruba o `up` se a variavel faltar. O Mailpit nao
  # pede autenticacao por padrao: publicado sem isto, o endereco entrega o codigo de reset
  # de qualquer conta do ambiente para quem o descobrir. A trava fica no proprio Mailpit, e
  # nao num middleware do Traefik, porque assim ela vale tambem para a porta 8025 publicada
  # na maquina e para a API HTTP que o e2e vai usar para ler o codigo.
  mailpit:
    restart: unless-stopped
    environment:
      MP_UI_AUTH: ${SAQZ_MAILPIT_AUTH:?defina SAQZ_MAILPIT_AUTH no .env como usuario:senha}
    networks:
      - default
      - local-server-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saqz-mail.rule=Host(`saqz-mail.brunoalmeida.dev`)"
      - "traefik.http.routers.saqz-mail.entrypoints=websecure"
      - "traefik.http.routers.saqz-mail.tls=true"
      - "traefik.http.services.saqz-mail.loadbalancer.server.port=8025"

  # Local postgres kept available under a profile, but not started by default
  # (the dev database now lives on Supabase).
  database:
    profiles: ["local-db"]

networks:
  local-server-network:
    external: true
