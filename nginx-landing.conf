server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O mime padrao mapeia .xml para text/xml sem charset. types vazio impede
    # esse mapeamento para o default_type valer; o Search Console espera XML.
    location = /sitemap.xml {
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
