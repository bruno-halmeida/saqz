server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Atrás do Traefik o nginx só vê http: redirecionamento relativo mantém o https do visitante.
    absolute_redirect off;

    # O mime padrao mapeia .xml para text/xml. types vazio faz o default_type valer.
    # Sem charset no Content-Type: o Search Console ja falhou com text/xml e com charset.
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=300";
    }

    location = /sitemap.txt {
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=300";
    }

    # Cadastro (/comecar/) e contratação (/assinar/) na web vêm do adm-web montado em
    # /usr/share/nginx/web; a config de produção é /assets/firebase-config.js desta landing.
    # Do assets do adm-web saem só os arquivos que as duas páginas usam: a config dele é a de
    # desenvolvimento e não pode chegar aqui.
    location = /comecar { return 301 /comecar/; }
    location = /assinar { return 301 /assinar/; }
    location /comecar/ { alias /usr/share/nginx/web/comecar/; }
    location /assinar/ { alias /usr/share/nginx/web/assinar/; }
    location ~ ^/assets/(logo\.png|inter-var\.ttf|saqz-volleyball\.svg)$ {
        alias /usr/share/nginx/web/assets/$1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
