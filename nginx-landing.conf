# Links antigos do web app (saqz.app/app/, fora do ar desde 21/10/2026): o "não vou" da presença vira a query do
# links.saqz.app canônico (/attendance/<token>?saqz_intent=decline). Fica no nível http (conf.d é incluído nele).
map $arg_saqz_intent $saqz_app_attendance_intent {
    decline "?saqz_intent=decline";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Atrás do Traefik o nginx só vê http: redirecionamento relativo mantém o https do visitante.
    absolute_redirect off;

    # Sem Cache-Control o navegador inventa um cache pelo Last-Modified e quem já visitou continua vendo
    # a landing antiga por horas (sem o botão novo, sem a medição). no-cache: guarda, mas confere a cada
    # visita (304 barato). Vale para os locations sem add_header próprio (sitemap e robots têm o seu).
    add_header Cache-Control "no-cache";

    # O mime padrao mapeia .xml para text/xml. types vazio faz o default_type valer.
    # Sem charset no Content-Type: o Search Console ja falhou com text/xml e com charset.
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=300";
    }

    location = /sitemap.txt {
        add_header Cache-Control "public, max-age=300";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=300";
    }

    # Cadastro (/comecar/) e contratação (/assinar/) na web vêm do adm-web montado em
    # /usr/share/nginx/web; a config de produção é /assets/firebase-config.js desta landing.
    # Do assets do adm-web saem só os arquivos que as duas páginas usam: a config dele é a de
    # desenvolvimento e não pode chegar aqui.
    location = /comecar { return 301 /comecar/; }
    location = /assinar { return 301 /assinar/; }
    location /comecar/ { alias /usr/share/nginx/web/comecar/; }
    location /assinar/ { alias /usr/share/nginx/web/assinar/; }
    location ~ ^/assets/(logo\.png|inter-var\.ttf|saqz-volleyball\.svg)$ {
        alias /usr/share/nginx/web/assets/$1;
    }

    # Login com Google do /comecar/ e do /assinar/: o authDomain é o próprio saqz.app (assets/firebase-config.js),
    # e /__/auth/ (handler do OAuth) e /__/firebase/ (config) vão de forma transparente para o Firebase. Assim a
    # volta do Google é first-party no Safari e no Chrome, que isolam o storage de terceiros. Antes isto ficava
    # no container do web app; o authDomain não muda.
    # https://firebase.google.com/docs/auth/web/redirect-best-practices (opção 3)
    location /__/ {
        proxy_pass https://saquz-app.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host saquz-app.firebaseapp.com;
        proxy_http_version 1.1;
    }

    # Temporário (apagar depois de 20/11/2026): quem abriu o web app entre 13 e 20/10 tem o service worker dele
    # instalado em /app/. O navegador confere este arquivo sozinho; a versão nova se instala na hora, apaga os
    # caches, se desregistra e recarrega as abas abertas, que caem no redirecionamento abaixo. A localização
    # exata vence o prefixo /app/, e o arquivo nunca redireciona (o navegador recusaria o service worker).
    location = /app/saqz-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'self.addEventListener("install", function () { self.skipWaiting(); });
self.addEventListener("activate", function (event) {
  event.waitUntil(self.registration.unregister()
    .then(function () { return caches.keys(); })
    .then(function (names) { return Promise.all(names.map(function (name) { return caches.delete(name); })); })
    .then(function () { return self.clients.matchAll({ type: "window" }); })
    .then(function (clients) { clients.forEach(function (client) { client.navigate(client.url); }); }));
});
';
    }

    # O web app saiu do ar em 21/10/2026: todo fluxo é o app nativo. Os links que a página de links e a landing
    # geraram entre 13 e 20/10 vão para a forma canônica de links.saqz.app, que leva ao app ou à loja:
    #   /app/?saqz_invite=X                          -> https://links.saqz.app/?saqz_invite=X
    #   /app/?saqz_onboarding=X                      -> https://links.saqz.app/?saqz_onboarding=X
    #   /app/?saqz_attendance=T[&saqz_intent=decline] -> https://links.saqz.app/attendance/T[?saqz_intent=decline]
    #   /app, /app/ e o resto                         -> https://links.saqz.app/ (com a query, se houver)
    # 302: o caminho /app pode voltar a ser usado um dia.
    location = /app {
        return 302 https://links.saqz.app/$is_args$args;
    }
    location /app/ {
        if ($arg_saqz_attendance ~ "^[A-Za-z0-9_-]{43}$") {
            return 302 https://links.saqz.app/attendance/$arg_saqz_attendance$saqz_app_attendance_intent;
        }
        return 302 https://links.saqz.app/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
