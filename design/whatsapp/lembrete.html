<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lembrete de presença no grupo</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- Topo da mensagem de botões "Vou"/"Não vou" que o Saqz manda no grupo vinculado. -->
<div class="canvas">
  <img class="ball" src="bola.svg" alt="">
  <div class="copy">
    <img class="logo" src="saqz-logo-negativo.svg" alt="Saqz">
    <h1>Vai pro jogo?</h1>
    <p class="lead">Toque em <b>Vou</b> ou <b>Não vou</b> aqui embaixo.<br>A galera fica sabendo na hora.</p>
  </div>
  <span class="foot">Grupo organizado no Saqz · saqz.app</span>
  <div class="card">
    <div class="eyebrow">PRÓXIMO JOGO</div>
    <h3>Quem vai?</h3>
    <div class="faces">
      <span class="face ok" style="background-image:url(../../landing-page/assets/img/face-1.jpg)"></span>
      <span class="face ok" style="background-image:url(../../landing-page/assets/img/face-2.jpg)"></span>
      <span class="face ok" style="background-image:url(../../landing-page/assets/img/face-3.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-4.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-5.jpg)"></span>
      <small>e você?</small>
    </div>
    <div class="response"><span class="yes">✓ Vou</span><span class="no">✕ Não vou</span></div>
    <p class="hint">Responda para a galera saber se conta com você.</p>
  </div>
</div>
</body>
</html>
