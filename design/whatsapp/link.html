<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prévia dos links</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- og:image de links.saqz.app: convite, presença e onboarding compartilhados à mão no WhatsApp. -->
<div class="canvas">
  <img class="ball" src="bola.svg" alt="">
  <div class="copy">
    <img class="logo" src="saqz-logo-negativo.svg" alt="Saqz">
    <h1 class="long">Seu grupo de vôlei está no Saqz</h1>
    <p class="lead">Entre no grupo e responda os jogos em um toque, sem caçar mensagem.</p>
  </div>
  <span class="foot">Organize o seu também · saqz.app</span>
  <div class="card">
    <div class="eyebrow">SEU GRUPO</div>
    <h3>A galera está aqui</h3>
    <div class="faces">
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-1.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-2.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-3.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-4.jpg)"></span>
      <span class="face" style="background-image:url(../../landing-page/assets/img/face-5.jpg)"></span>
    </div>
    <div class="rows">
      <div class="row"><i><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></i>Quem vai no próximo jogo</div>
      <div class="row"><i><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></i>Onde é e que horas</div>
      <div class="row"><i><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></i>Quem já pagou</div>
    </div>
    <div class="join">Entrar no grupo</div>
  </div>
</div>
</body>
</html>
