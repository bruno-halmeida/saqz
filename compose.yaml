name: saqz

services:
  backend:
    image: saqz-backend:dev
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${SAQZ_BACKEND_PORT:-8080}:8080"
      # Porta de gestao (health + prometheus): so loopback, para o deploy.sh e para debug local.
      - "127.0.0.1:${SAQZ_MANAGEMENT_PORT:-9090}:9090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Log em JSON (formato logstash nativo do Boot; MDC sai como campo) e /actuator numa porta
      # que o Traefik nao publica. Por env, nao por perfil: ver application.properties.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
      MANAGEMENT_SERVER_PORT: "9090"
      SAQZ_FIREBASE_PROJECT_ID: saqz-dev
      SAQZ_LINKS_DOMAIN: https://links.saqz.app
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/saqz
      SPRING_DATASOURCE_USERNAME: saqz
      SPRING_DATASOURCE_PASSWORD: saqz-local-dev-only
      SAQZ_MAIL_HOST: mailpit
      SAQZ_MAIL_STARTTLS: "false"
      # Chave do HMAC dos codigos de recuperacao. Sem default na aplicacao de proposito:
      # e ela que impede um dump do banco de inverter um codigo de quatro digitos.
      # Este valor e so de desenvolvimento; producao define o seu.
      SAQZ_PASSWORD_RESET_SECRET: apenas-para-desenvolvimento-local-nao-use-em-producao
      # Origens liberadas para o adm-web (CORS de /admin/**). Vazio = nada liberado.
      SAQZ_ADMINWEB_ORIGINS: ${SAQZ_ADMINWEB_ORIGINS:-}
      # WhatsApp (Uazapi). Desligado por padrao. Atencao: ligar aqui com o token
      # de producao faz o ambiente local enviar mensagens reais.
      SAQZ_NOTIFICATIONS_WHATSAPP_ENABLED: ${SAQZ_NOTIFICATIONS_WHATSAPP_ENABLED:-false}
      SAQZ_NOTIFICATIONS_WHATSAPP_BASEURL: ${SAQZ_NOTIFICATIONS_WHATSAPP_BASEURL:-https://saqzapp.uazapi.com}
      SAQZ_NOTIFICATIONS_WHATSAPP_TOKEN: ${SAQZ_NOTIFICATIONS_WHATSAPP_TOKEN:-}
      SAQZ_NOTIFICATIONS_WHATSAPP_DELAYMS: ${SAQZ_NOTIFICATIONS_WHATSAPP_DELAYMS:-15000}
      SAQZ_NOTIFICATIONS_REMINDER_ENABLED: ${SAQZ_NOTIFICATIONS_REMINDER_ENABLED:-true}
      SAQZ_NOTIFICATIONS_REMINDER_DELAY_MS: ${SAQZ_NOTIFICATIONS_REMINDER_DELAY_MS:-25200000}
    secrets:
      - firebase-admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # SMTP local: nada sai da máquina, a caixa de entrada abre em http://localhost:8025.
  # O Mailpit não faz STARTTLS, por isso o backend acima desliga TLS explicitamente
  # (SAQZ_MAIL_STARTTLS: "false") em vez de herdar o default `true` de produção —
  # com o default, `starttls.required` recusaria a entrega, que é o comportamento certo.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SAQZ_MAILPIT_UI_PORT:-8025}:8025"
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saqz
      POSTGRES_USER: saqz
      POSTGRES_PASSWORD: saqz-local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saqz -d saqz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - saqz-postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

secrets:
  firebase-admin:
    file: ./.secrets/firebase-dev-service-account.json

volumes:
  saqz-postgres-data:
