<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Saqz — abrir o link</title>
<!-- Prévia no WhatsApp para convite, presença e onboarding: a mesma imagem para todos os links.
     Fonte da imagem em design/whatsapp (render.sh). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Saqz">
<meta property="og:title" content="Saqz · seu grupo de vôlei">
<meta property="og:description" content="Entre no grupo e responda os jogos em um toque, sem caçar mensagem.">
<meta property="og:image" content="https://links.saqz.app/assets/whatsapp-link.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Saqz: seu grupo de vôlei está no Saqz.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://links.saqz.app/assets/whatsapp-link.jpg?v=2">
<style>
  :root { --blue:#0638df; --lime:#c7f300; --ink:#071025; --paper:#f4f5f0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  main { width:min(400px,100%); text-align:center; }
  .logo { width:150px; height:auto; }
  h1 { font-size:24px; line-height:1.2; margin:28px 0 12px; letter-spacing:-.02em; }
  p { font-size:15px; line-height:1.5; margin:0 0 28px; color:#3c4257; }
  .primary, .secondary {
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    padding:16px 24px; border-radius:999px; text-decoration:none; font-size:15px; font-weight:700;
  }
  .primary { background:var(--blue); color:#fff; }
  .secondary { margin-top:12px; background:transparent; color:var(--ink); border:1.5px solid rgba(7,16,37,.18); }
  .primary:active, .secondary:active { transform:scale(.98); }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/saqz-logo.svg" alt="Saqz">
  <h1 id="heading">Este link abre no app Saqz</h1>
  <p id="lead">Entre no grupo ou confirme sua presença no Saqz.</p>
  <a id="primary" class="primary" href="https://saqz.app">Acessar site do Saqz</a>
  <a id="secondary" class="secondary" hidden></a>
  <a id="tertiary" class="secondary" hidden></a>
</main>
<script>
  (function () {
    // O celular vai direto para a loja do sistema dele (iPhone: App Store; Android: Google Play).
    var appStore = "https://apps.apple.com/br/app/id6812743525";
    var googlePlay = "https://play.google.com/store/apps/details?id=app.saqz";
    var site = "https://saqz.app";
    var code = "[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]";
    var path = location.pathname.match(new RegExp("^/attendance/(" + code + ")$"));
    var params = new URLSearchParams(location.search);
    var invite = inviteCode(params.get("saqz_invite"));
    var onboarding = params.get("saqz_onboarding");
    var decline = params.get("saqz_intent") === "decline";
    var kind = null;
    var route = null;
    if (path) {
      kind = "attendance";
      route = "attendance/" + path[1] + (decline ? "?saqz_intent=decline" : "");
    } else if (invite) {
      kind = "invite";
      route = "?saqz_invite=" + invite;
    } else if (onboarding && new RegExp("^" + code + "$").test(onboarding)) {
      kind = "onboarding";
      route = "?saqz_onboarding=" + onboarding;
    }
    // Convite: código curto de 8 caracteres (44DF8SA8; aceita 44DF-8SA8 e minúsculas, e vai adiante sem
    // hífen) ou o token longo dos links já enviados. Qualquer outra coisa não é convite.
    function inviteCode(value) {
      if (!value) return null;
      if (new RegExp("^" + code + "$").test(value)) return value;
      var short = value.replace(/[-\s]/g, "").toUpperCase();
      return /^[2-9A-HJKMNP-Z]{8}$/.test(short) ? short : null;
    }
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(navigator.userAgent);
    var heading = document.getElementById("heading");
    var lead = document.getElementById("lead");
    var primary = document.getElementById("primary");
    var secondary = document.getElementById("secondary");
    var tertiary = document.getElementById("tertiary");

    if (kind === "invite") heading.textContent = "Entre no grupo no Saqz";
    if (kind === "onboarding") heading.textContent = "Continue no app Saqz";
    if (kind === "attendance") heading.textContent = "Responda no Saqz";

    // O computador segue para o web app (saqz.app/app/), com o mesmo código na query. Só se ele
    // responder: fora do ar, vale o pedido para abrir o link no celular. O iPhone vai à App Store.
    var webApp = "https://saqz.app/app/";
    var webQuery = kind === "attendance" ? "?saqz_attendance=" + path[1] + (decline ? "&saqz_intent=decline" : "")
      : kind ? route : "";
    // No Android, o atleta (convite ou presença) também responde pelo navegador: o intent segue
    // tentando abrir o app de quem o tem, mas o fallback passa a ser o web app, não o Play.
    // O onboarding (organizador) e o link sem parâmetro continuam indo ao Play.
    var androidWeb = isAndroid && (kind === "invite" || kind === "attendance");
    var wantsWebApp = ((!isIOS && !isAndroid) || androidWeb) && supportsWasmGc();
    if (wantsWebApp && typeof fetch === "function") {
      var waiting = lead.textContent;
      lead.textContent = "Abrindo o Saqz…";
      fetch(webApp + "disponivel.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("web app fora do ar");
          if (androidWeb) {
            lead.textContent = waiting;
            appFlow(webApp + webQuery);
          } else {
            location.replace(webApp + webQuery);
          }
        })
        .catch(function () {
          lead.textContent = waiting;
          appFlow();
        });
    } else {
      appFlow();
    }

    function appFlow(webUrl) {
      if (!isIOS && !isAndroid) {
        if (kind) lead.textContent = "Abra este link no celular para continuar no app.";
        return;
      }

      // Convite, onboarding e presença seguem para o Play no `referrer`, para o app retomá-los
      // depois da instalação: o link de presença também traz quem ainda não está no grupo, que
      // entra e já confirma. O "não vou" vai junto, para nunca virar confirmação.
      var referrer = kind === "attendance" ? "saqz_attendance=" + path[1] + (decline ? "&saqz_intent=decline" : "")
        : kind ? route.slice(1) : null;
      var store = isIOS ? appStore : googlePlay + (referrer ? "&referrer=" + encodeURIComponent(referrer) : "");
      var storeLabel = isIOS ? "Baixar na App Store" : "Baixar no Google Play";
      // Se o intent não abrir o app, o Chrome segue para o fallback: o web app, quando ele está no ar.
      var fallbackUrl = webUrl || store;
      var open = !kind ? null : isAndroid
        ? "intent://links.saqz.app/" + route + "#Intent;scheme=https;package=app.saqz;S.browser_fallback_url=" +
          encodeURIComponent(fallbackUrl) + ";end"
        : "saqz:///" + route;

      // Android com o web app no ar: o navegador é o caminho principal; a loja fica de apoio.
      if (webUrl) {
        lead.textContent = "Responda pelo navegador, sem instalar nada. Se preferir, baixe o app e entre com a mesma conta.";
        link(primary, webUrl, "Continuar no navegador");
        link(secondary, store, "Baixar o app");
        link(tertiary, open, "Já instalei, abrir o app");
      } else {
        if (kind) lead.textContent = "Baixe o app e, depois de instalar, toque de novo no link que você recebeu.";
        link(primary, store, storeLabel);
        // iPhone: os dois selos, App Store primeiro (o redirecionamento automático segue indo à App Store).
        if (isIOS) {
          link(secondary, googlePlay + (referrer ? "&referrer=" + encodeURIComponent(referrer) : ""), "Baixar no Google Play");
          if (open) link(tertiary, open, "Já instalei, abrir o app");
        } else if (open) {
          link(secondary, open, "Já instalei, abrir o app");
        }
      }

      // Sem clique. No Android, o intent abre o app com o link ou, sem o app, o Chrome segue
      // para o fallback (o web app para convite e presença, quando ele responde; senão o Play);
      // se o navegador recusar o intent sem toque, o fallback entra no lugar.
      // No iPhone nenhum link tenta o esquema sozinho: quem chega à página costuma não ter o app
      // (com o app, o link universal já abriu direto), e o Safari responderia com o alerta de
      // endereço inválido. Então vai direto à loja; "Já instalei, abrir o app" fica no botão.
      if (isAndroid) {
        if (!open) return location.replace(store);
        location.href = open;
        var fallback = setTimeout(function () { if (!document.hidden) location.replace(fallbackUrl); }, 1500);
        ["visibilitychange", "pagehide"].forEach(function (event) {
          addEventListener(event, function () { clearTimeout(fallback); });
        });
      } else {
        location.replace(store);
      }
    }

    // O web app é Kotlin/Wasm e precisa de WasmGC (iOS 18.2+): sem ele, o caminho de antes.
    function supportsWasmGc() {
      try {
        return typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 127, 0]));
      } catch (e) {
        return false;
      }
    }

    function link(element, href, text) {
      element.href = href;
      element.textContent = text;
      element.hidden = false;
    }
  })();
</script>
</body>
</html>
