<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Saqz — abrir no app</title>
<style>
  :root { --blue:#0638df; --lime:#c7f300; --ink:#071025; --paper:#f4f5f0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  main { width:min(400px,100%); text-align:center; }
  .logo { width:150px; height:auto; }
  h1 { font-size:24px; line-height:1.2; margin:28px 0 12px; letter-spacing:-.02em; }
  p { font-size:15px; line-height:1.5; margin:0 0 28px; color:#3c4257; }
  .primary {
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    padding:16px 24px; border-radius:999px; background:var(--blue); color:#fff;
    text-decoration:none; font-size:15px; font-weight:700;
  }
  .primary:active { transform:scale(.98); }
  .note { display:block; margin-top:18px; font-size:13px; line-height:1.5; color:#6b7280; }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/saqz-logo.svg" alt="Saqz">
  <h1>Este link abre no app Saqz</h1>
  <p>Instale o app para entrar no grupo ou confirmar sua presença. Depois de instalar, toque no link novamente.</p>
  <!-- Quando publicados, trocar por https://apps.apple.com/app/id<APP_ID> e https://play.google.com/store/apps/details?id=app.saqz -->
  <a class="primary" href="https://saqz.app">Baixar o app</a>
  <span class="note">Já tem o app instalado? Toque no link de novo — ele abre direto.</span>
</main>
</body>
</html>
