<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Saqz — abrir o link</title>
<!-- Prévia no WhatsApp para convite, presença e onboarding: a mesma imagem para todos os links.
     Fonte da imagem em design/whatsapp (render.sh). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Saqz">
<meta property="og:title" content="Saqz · seu grupo de vôlei">
<meta property="og:description" content="Entre no grupo e responda os jogos em um toque, sem caçar mensagem.">
<meta property="og:image" content="https://links.saqz.app/assets/whatsapp-link.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Saqz: seu grupo de vôlei está no Saqz.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://links.saqz.app/assets/whatsapp-link.jpg?v=2">
<style>
  :root { --blue:#0638df; --lime:#c7f300; --ink:#071025; --paper:#f4f5f0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif;
    padding:24px;
  }
  main { width:min(400px,100%); text-align:center; }
  .logo { width:150px; height:auto; }
  h1 { font-size:24px; line-height:1.2; margin:28px 0 12px; letter-spacing:-.02em; }
  p { font-size:15px; line-height:1.5; margin:0 0 28px; color:#3c4257; }
  .primary, .secondary {
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    padding:16px 24px; border-radius:999px; text-decoration:none; font-size:15px; font-weight:700;
  }
  .primary { background:var(--blue); color:#fff; }
  .secondary { margin-top:12px; background:transparent; color:var(--ink); border:1.5px solid rgba(7,16,37,.18); }
  .primary:active, .secondary:active { transform:scale(.98); }
  .quiet { display:inline-block; margin-top:20px; font-size:13px; color:#6b7186; text-decoration:underline; }
  .qr { width:200px; margin:0 auto 24px; padding:12px; background:#fff; border-radius:16px; }
  .qr svg { display:block; width:100%; height:auto; }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/saqz-logo.svg" alt="Saqz">
  <h1 id="heading">Este link abre no app Saqz</h1>
  <p id="lead">Entre no grupo ou confirme sua presença no Saqz.</p>
  <div id="qr" class="qr" role="img" aria-label="QR code para abrir este link no celular" hidden></div>
  <a id="primary" class="primary" href="https://saqz.app">Acessar site do Saqz</a>
  <a id="secondary" class="secondary" hidden></a>
  <a id="tertiary" class="quiet" hidden></a>
</main>
<script src="/assets/qrcode.js"></script>
<script>
  (function () {
    // O celular vai para a loja do sistema dele (iPhone: App Store; Android: Google Play).
    var appStore = "https://apps.apple.com/br/app/id6812743525";
    var googlePlay = "https://play.google.com/store/apps/details?id=app.saqz";
    var site = "https://saqz.app";
    var code = "[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]";
    var path = location.pathname.match(new RegExp("^/attendance/(" + code + ")$"));
    var params = new URLSearchParams(location.search);
    var invite = inviteCode(params.get("saqz_invite"));
    var onboarding = params.get("saqz_onboarding");
    var decline = params.get("saqz_intent") === "decline";
    var kind = null;
    var route = null;
    if (path) {
      kind = "attendance";
      route = "attendance/" + path[1] + (decline ? "?saqz_intent=decline" : "");
    } else if (invite) {
      kind = "invite";
      route = "?saqz_invite=" + invite;
    } else if (onboarding && new RegExp("^" + code + "$").test(onboarding)) {
      kind = "onboarding";
      route = "?saqz_onboarding=" + onboarding;
    }
    // Convite: código curto de 8 caracteres (44DF8SA8; aceita 44DF-8SA8 e minúsculas, e vai adiante sem
    // hífen) ou o token longo dos links já enviados. Qualquer outra coisa não é convite.
    function inviteCode(value) {
      if (!value) return null;
      if (new RegExp("^" + code + "$").test(value)) return value;
      var short = value.replace(/[-\s]/g, "").toUpperCase();
      return /^[2-9A-HJKMNP-Z]{8}$/.test(short) ? short : null;
    }
    var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(navigator.userAgent);
    var heading = document.getElementById("heading");
    var lead = document.getElementById("lead");
    var primary = document.getElementById("primary");
    var secondary = document.getElementById("secondary");
    var tertiary = document.getElementById("tertiary");

    if (kind === "invite") heading.textContent = "Entre no grupo no Saqz";
    if (kind === "onboarding") heading.textContent = "Continue no app Saqz";
    if (kind === "attendance") heading.textContent = "Responda no Saqz";

    // O computador segue para o web app (saqz.app/app/), com o mesmo código na query. Só se ele
    // responder: fora do ar, vale o pedido para abrir o link no celular. O celular (Android e iPhone)
    // não usa o web app: o atleta instala o app pela loja e o app retoma o link.
    var webApp = "https://saqz.app/app/";
    var webQuery = kind === "attendance" ? "?saqz_attendance=" + path[1] + (decline ? "&saqz_intent=decline" : "")
      : kind ? route : "";
    // Convite e presença no computador: sem redirecionamento. O QR leva o link ao celular, que segue
    // o fluxo do app; o web app fica num link discreto, só se responde e há WasmGC.
    var desktopLink = !isIOS && !isAndroid && (kind === "invite" || kind === "attendance");
    if (desktopLink) return desktopFlow();
    var wantsWebApp = !isIOS && !isAndroid && supportsWasmGc();
    if (wantsWebApp && typeof fetch === "function") {
      var waiting = lead.textContent;
      lead.textContent = "Abrindo o Saqz…";
      fetch(webApp + "disponivel.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("web app fora do ar");
          location.replace(webApp + webQuery);
        })
        .catch(function () {
          lead.textContent = waiting;
          appFlow();
        });
    } else {
      appFlow();
    }

    // Android, convite e presença: o web app nunca é o caminho principal nem o fallback do intent.
    // Só um link discreto, para quem não pode instalar, e só se o web app responde e há WasmGC.
    if (isAndroid && (kind === "invite" || kind === "attendance") && supportsWasmGc() && typeof fetch === "function") {
      fetch(webApp + "disponivel.json", { cache: "no-store" })
        .then(function (response) {
          if (response.ok) link(tertiary, webApp + webQuery, "Continuar no navegador");
        })
        .catch(function () {});
    }

    function appFlow() {
      if (!isIOS && !isAndroid) {
        if (kind) lead.textContent = "Abra este link no celular para continuar no app.";
        return;
      }

      // Convite, onboarding e presença seguem para o Play no `referrer`, para o app retomá-los
      // depois da instalação: o link de presença também traz quem ainda não está no grupo, que
      // entra e já confirma. O "não vou" vai junto, para nunca virar confirmação.
      var referrer = kind === "attendance" ? "saqz_attendance=" + path[1] + (decline ? "&saqz_intent=decline" : "")
        : kind ? route.slice(1) : null;
      var store = isIOS ? appStore : googlePlay + (referrer ? "&referrer=" + encodeURIComponent(referrer) : "");
      var open = !kind ? null : isAndroid
        ? "intent://links.saqz.app/" + route + "#Intent;scheme=https;package=app.saqz;S.browser_fallback_url=" +
          encodeURIComponent(store) + ";end"
        : "saqz:///" + route;

      if (kind) lead.textContent = "Instale o Saqz e entre com sua conta: o app abre " +
        (kind === "invite" ? "o convite" : kind === "attendance" ? "o jogo" : "o próximo passo") + " sozinho.";

      if (isAndroid) {
        link(primary, store, "Baixar no Google Play");
        if (open) link(secondary, open, "Já instalei, abrir o app");
        // Sem clique. O intent abre o app com o link ou, sem o app, o Chrome segue para o Play com
        // o `referrer`; se o navegador recusar o intent sem toque, o fallback entra no lugar.
        if (!open) return location.replace(store);
        location.href = open;
        var fallback = setTimeout(function () { if (!document.hidden) location.replace(store); }, 1500);
        ["visibilitychange", "pagehide"].forEach(function (event) {
          addEventListener(event, function () { clearTimeout(fallback); });
        });
        return;
      }

      // iPhone: a loja não leva o link adiante, então não há redirecionamento automático. O toque
      // copia o link desta página e só então abre a App Store; o app lê a área de transferência no
      // primeiro login. Nenhum link tenta o esquema sozinho: o Safari responderia com o alerta de
      // endereço inválido (quem tem o app já abriu pelo link universal).
      link(primary, store, kind ? "Baixar o app e continuar" : "Baixar na App Store");
      if (open) link(secondary, open, "Já instalei, abrir o app");
      if (kind) {
        primary.addEventListener("click", function (event) {
          event.preventDefault();
          copyLink("https://links.saqz.app" + location.pathname + location.search, function () {
            location.href = store;
          });
        });
      }
    }

    function desktopFlow() {
      lead.textContent = "Aponte a câmera do celular para o QR code e continue no app.";
      drawQr("https://links.saqz.app/" + route);
      link(primary, appStore, "Baixar na App Store");
      link(secondary, googlePlay, "Baixar no Google Play");
      if (supportsWasmGc() && typeof fetch === "function") {
        fetch(webApp + "disponivel.json", { cache: "no-store" })
          .then(function (response) {
            if (response.ok) link(tertiary, webApp + webQuery, "Continuar no computador");
          })
          .catch(function () {});
      }
    }

    // O QR é desenhado aqui mesmo (assets/qrcode.js): o link nunca sai do navegador. Sem a lib, só as lojas.
    function drawQr(text) {
      var box = document.getElementById("qr");
      try {
        if (typeof qrcode !== "function") return;
        var code = qrcode(0, "M");
        code.addData(text);
        code.make();
        box.innerHTML = code.createSvgTag({ cellSize: 4, margin: 4, scalable: true });
        box.setAttribute("data-link", text);
        box.hidden = false;
      } catch (e) {
        box.hidden = true;
      }
    }

    // Copia dentro do gesto do toque; a loja abre mesmo se a cópia falhar.
    function copyLink(text, done) {
      function legacy() {
        try {
          var field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          field.setSelectionRange(0, text.length);
          document.execCommand("copy");
          document.body.removeChild(field);
        } catch (e) { /* segue para a loja */ }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacy(); done(); });
      } else {
        legacy();
        done();
      }
    }

    // O web app é Kotlin/Wasm e precisa de WasmGC (iOS 18.2+): sem ele, o caminho de antes.
    function supportsWasmGc() {
      try {
        return typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 127, 0]));
      } catch (e) {
        return false;
      }
    }

    function link(element, href, text) {
      element.href = href;
      element.textContent = text;
      element.hidden = false;
    }
  })();
</script>
</body>
</html>
