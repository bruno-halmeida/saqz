<!--
  Referência visual. O Firebase trava o corpo deste template ("To help prevent
  spam, the message can't be edited"). Quem manda o HTML é o SMTP nosso:
  EmailVerificationMailer, pedido autenticado em POST /api/email-verification/request.
  Não cola isto no Console — o Firebase ignora.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Confirme seu e-mail no Saqz</title>
</head>
<body style="margin:0;padding:0;background:#F5F5F7;">
  <div style="display:none;max-height:0;overflow:hidden;">
    Confirme seu e-mail no Saqz para continuar.
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5F5F7;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;">
          <tr>
            <td style="background:#0638DF;border-radius:16px 16px 0 0;padding:24px 28px;">
              <img src="https://saqz.app/assets/saqz-mark.png" width="48" height="48" alt="Saqz" style="display:block;border:2px solid #FFFFFF;border-radius:12px;">
              <p style="margin:16px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#C7F300;">Saqz</p>
              <p style="margin:12px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:26px;line-height:1.2;font-weight:700;color:#FFFFFF;">Quase lá.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#FFFFFF;padding:28px;border:1px solid #D8DDE8;border-top:0;border-radius:0 0 16px 16px;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#0E1738;">
                Confirme que este e-mail é seu. Depois é só voltar ao app e organizar a galera.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px 0 8px;">
                <tr>
                  <td align="center" bgcolor="#C7F300" style="border-radius:12px;">
                    <a href="%LINK%" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#0E1738;text-decoration:none;">
                      Confirmar e-mail
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#667085;">
                Se o botão não abrir, copie este link:<br>
                <a href="%LINK%" style="color:#0638DF;word-break:break-all;">%LINK%</a>
              </p>
              <p style="margin:20px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#667085;">
                Se não foi você que criou esta conta, ignore este e-mail.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
