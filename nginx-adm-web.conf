server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The committed bundle hardcodes the dev API address; rewrite it to the
    # public API hostname as files are served, so a plain `git pull` keeps working.
    sub_filter_types application/javascript text/javascript application/json;
    sub_filter 'http://127.0.0.1:8080' 'https://saqz-api.brunoalmeida.dev';
    sub_filter_once off;

    # SPA fallback: unknown paths serve index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deployment config must never be cached at the edge
    location = /assets/firebase-config.js {
        add_header Cache-Control "no-store";
    }
}
