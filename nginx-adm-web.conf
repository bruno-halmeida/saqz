server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The committed bundle hardcodes the dev API address; rewrite it to the
    # public API hostname as files are served, so a plain `git pull` keeps working.
    sub_filter_types application/javascript text/javascript application/json;
    sub_filter 'http://127.0.0.1:8080' 'https://saqz-api.brunoalmeida.dev';
    sub_filter_once off;

    # Cabeçalhos de proteção do painel: nunca em iframe (clickjacking), sem adivinhar tipo de conteúdo, sem vazar a
    # URL do painel no Referer. O nginx não herda add_header do server em location com add_header próprio.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback: unknown paths serve index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deployment config must never be cached at the edge
    location = /assets/firebase-config.js {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # /assinar/*.js was HIT at Cloudflare for 4h, so a git pull did not reach the browser.
    location ^~ /assinar/ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /assinar/index.html;
    }

    location ^~ /comecar/ {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /comecar/index.html;
    }
}
