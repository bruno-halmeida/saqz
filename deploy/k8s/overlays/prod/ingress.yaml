apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: api.saqz.app
      http:
        paths:
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  name: management
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
