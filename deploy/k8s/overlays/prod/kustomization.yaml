apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saqz-prod
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
images:
  - name: ghcr.io/bruno-halmeida/saqz-backend
    # Cada deploy fixa uma tag Git publicada pelo workflow de release.
    newTag: v.0.0.1
configMapGenerator:
  - name: backend-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - SAQZ_FIREBASE_PROJECT_ID=saquz-app
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-admin.json
      - MANAGEMENT_SERVER_PORT=9090
      - LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
      # `native` = RemoteIpValve lendo CF-Connecting-IP (application.properties); `framework` lia o X-Forwarded-For,
      # que atrás do túnel era sempre o IP do cloudflared e deixava os limites por IP globais.
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - SERVER_SHUTDOWN=graceful
      - SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE=25s
      - SAQZ_LINKS_DOMAIN=https://links.saqz.app
      - SAQZ_ASAAS_BASE_URL=https://api.asaas.com/v3
      # Apple ID numerico do app (App Store Connect > Informacoes do app). Vazio = a API recusa
      # compras de producao da App Store; sandbox (revisao e TestFlight) segue aceito.
      - SAQZ_APP_STORE_APP_APPLE_ID=6812743525
      # Cadastro e contratação na web (saqz.app/comecar/ e /assinar/) e o painel adm-web de produção
      # (adm.saqz.app) chamam a API pelo navegador. Lista separada por vírgula: tirar saqz.app quebra o site.
      - SAQZ_ADMINWEB_ORIGINS=https://saqz.app,https://adm.saqz.app
      - SAQZ_NOTIFICATIONS_WHATSAPP_ENABLED=true
      # Imagem no topo do lembrete do grupo. A Uazapi/WhatsApp guarda a imagem pelo endereço: ao trocar
      # a imagem, publique com nome novo em links-page/assets e aponte aqui (design/whatsapp/render.sh).
      - SAQZ_NOTIFICATIONS_WHATSAPP_GROUP_REMINDER_IMAGE_URL=https://links.saqz.app/assets/whatsapp-lembrete-v2.jpg
      - SAQZ_NOTIFICATIONS_REMINDER_ENABLED=true
      # Janela de presença: cartão ao vivo (Live Activity no iPhone, Live Update no Android) de 8 h antes do prazo até o prazo (DEB-113).
      # Decisão do dono em 20/10: já nasce ligada em produção. Para desligar, apague a linha e faça o deploy.
      - SAQZ_NOTIFICATIONS_ATTENDANCE_WINDOW_ENABLED=true
      # Cupom de campanha: cria as ofertas no Google Play e os códigos na App Store (docs/subscriptions, seção Cupons).
      # Só produção liga: dev usa as mesmas lojas. A chave da App Store Connect fica no backend.env (Secret).
      - SAQZ_COUPON_STORE_SYNC=true
