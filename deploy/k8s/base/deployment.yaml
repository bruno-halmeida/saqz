apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: saqz-backend
  template:
    metadata:
      labels:
        app: saqz-backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        # UID/GID do usuário saqz na imagem Alpine do Dockerfile.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/bruno-halmeida/saqz-backend:v.0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - secretRef:
                name: backend-env
            - configMapRef:
                name: backend-config
          env:
            # Obrigatório para não herdar a página de contratação de staging.
            - name: SAQZ_SUBSCRIPTION_PURCHASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-env
                  key: SAQZ_SUBSCRIPTION_PURCHASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: firebase-admin
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: firebase-admin
          secret:
            secretName: firebase-admin
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
