# Painel adm-web de produção em https://adm.saqz.app (serviço adm-web-prod do compose.server.yaml).
# Sem o sub_filter do 127.0.0.1 da versão de dev: o painel lê a API de assets/firebase-config.js
# (firebase-config.prod.js). Fora da busca: X-Robots-Tag em toda resposta e o robots.txt do adm-web
# (Disallow: /). O nginx não herda add_header do server para location com add_header próprio, por isso
# cada uma repete a linha.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    # Cabeçalhos de proteção do painel: nunca em iframe (clickjacking), sem adivinhar tipo de conteúdo, sem vazar a
    # URL do painel no Referer. O nginx não herda add_header do server em location com add_header próprio.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback: unknown paths serve index.html so client-side routing works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login com Google: o authDomain do painel é o próprio adm.saqz.app (firebase-config.prod.js), e /__/auth/
    # (handler do OAuth) e /__/firebase/ (config) vão de forma transparente para o Firebase, como no nginx da
    # landing (nginx-landing.conf). Assim a volta do Google é first-party no Safari e no Chrome.
    # https://firebase.google.com/docs/auth/web/redirect-best-practices (opção 3)
    location /__/ {
        proxy_pass https://saquz-app.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host saquz-app.firebaseapp.com;
        proxy_http_version 1.1;
    }

    # Deployment config must never be cached at the edge
    location = /assets/firebase-config.js {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Cadastro e contratação ficam em saqz.app; aqui só o painel.
    location ^~ /comecar/ {
        return 301 https://saqz.app$request_uri;
    }

    location ^~ /assinar/ {
        return 301 https://saqz.app$request_uri;
    }
}
