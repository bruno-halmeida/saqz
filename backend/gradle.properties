org.gradle.caching=true
# Modulos independentes (access, groups, subscriptions...) compilam e testam em paralelo.
org.gradle.parallel=true
# Runner do GitHub tem 7 GB: o padrao (512 MB no Gradle e no daemon do Kotlin) estoura ao compilar os testes
# de groups e bootstrap (OOM a 256 MB, no limite a 384 MB). Folga sobre isso, sobrando RAM para JVMs de teste e Postgres.
org.gradle.jvmargs=-Xmx1g
kotlin.daemon.jvmargs=-Xmx2g
