spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SMTP por variavel de ambiente. Nenhum valor de provedor mora aqui: os defaults
# apontam para o Mailpit do compose.yaml e falham alto se producao nao configurar.
spring.mail.host=${SAQZ_MAIL_HOST:localhost}
spring.mail.port=${SAQZ_MAIL_PORT:1025}
spring.mail.username=${SAQZ_MAIL_USERNAME:}
spring.mail.password=${SAQZ_MAIL_PASSWORD:}
# `enable` sozinho e oportunista: servidor que nao anuncia STARTTLS (ou capability
# removida em transito) segue em texto puro, com o codigo e a credencial SMTP dentro.
# `required` anda amarrado a mesma variavel para os dois nunca divergirem.
spring.mail.properties.mail.smtp.starttls.enable=${SAQZ_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SAQZ_MAIL_STARTTLS:true}
# Sem isto o Jakarta Mail espera para sempre. O envio e sincrono e o VUL-80 chama de
# dentro de um endpoint, entao um SMTP que trava na saudacao seguraria a thread do
# servlet ate esgotar o pool.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
saqz.mail.from=${SAQZ_MAIL_FROM:nao-responda@saqz.local}
# Checkout web (VUL-207/212). Sem default o placeholder nao resolve e a API nem sobe:
# nem o compose.yaml nem o overlay do servidor definem a variavel. O default aponta para
# o adm-web ja publicado; so precisa da variavel quando o dominio mudar.
saqz.subscription.purchase-url=${SAQZ_SUBSCRIPTION_PURCHASE_URL:https://saqzweb.brunoalmeida.dev/assinar/}
# SMTP fora do ar nao derruba a API inteira: o envio falha alto sozinho.
management.health.mail.enabled=false

# Correlacao nos logs: o id do request e o subject do Firebase entram em toda linha logada
# dentro do request, nao so na `request_complete`. O userId do Postgres sai por JOIN em
# users(firebase_subject) na investigacao; nao se paga um SELECT por request para logar.
logging.pattern.level=%5p [corr=%X{correlationId:-} att=%X{attempt:-} sub=%X{subject:-}]

# Metricas (VUL-252). O endpoint /actuator/prometheus so existe na porta de gestao. No Docker
# o compose.yaml move a gestao para 9090 (MANAGEMENT_SERVER_PORT) e liga o log JSON
# (LOGGING_STRUCTURED_FORMAT_CONSOLE) por variavel de ambiente, nunca por perfil:
# FirebaseEnvironmentIsolationIntegrationTest sobe contextos com o perfil dev e um
# application-dev.properties vazaria o encoder JSON para o resto da suite.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Job de mensalidades (VUL-175). Roda todo dia e gera as charges MONTHLY de quem vence hoje.
# O fuso vale para o cron e para o "hoje" que o job usa: os dois leem a mesma variavel para nunca
# divergirem (cron a meia-noite em SP com "hoje" em UTC geraria o dia errado).
saqz.finance.monthly-charges.cron=${SAQZ_MONTHLY_CHARGES_CRON:0 10 3 * * *}
saqz.finance.monthly-charges.zone=${SAQZ_MONTHLY_CHARGES_ZONE:America/Sao_Paulo}

# Asaas (VUL-103/105). Vazios = beans de webhook nao sobem (ver AsaasWebhookConfiguration).
saqz.asaas.api-key=${SAQZ_ASAAS_API_KEY:}
saqz.asaas.base-url=${SAQZ_ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
saqz.asaas.webhook-token=${SAQZ_ASAAS_WEBHOOK_TOKEN:}
