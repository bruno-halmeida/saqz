spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# SMTP por variavel de ambiente. Nenhum valor de provedor mora aqui: os defaults
# apontam para o Mailpit do compose.yaml e falham alto se producao nao configurar.
spring.mail.host=${SAQZ_MAIL_HOST:localhost}
spring.mail.port=${SAQZ_MAIL_PORT:1025}
spring.mail.username=${SAQZ_MAIL_USERNAME:}
spring.mail.password=${SAQZ_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${SAQZ_MAIL_STARTTLS:true}
saqz.mail.from=${SAQZ_MAIL_FROM:nao-responda@saqz.local}
# SMTP fora do ar nao derruba a API inteira: o envio falha alto sozinho.
management.health.mail.enabled=false
